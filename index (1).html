<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jingle &amp; Mingle RSVP</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--paper:#f6f2ea;--ink:#22392a;--muted:#6a766d;--red:#b3263a;--navy:#1f2c5c;--line:#d9d2c4}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.55}
.top{height:8px;background:linear-gradient(90deg,var(--navy) 0 33.33%,#fff 33.33% 66.66%,var(--red) 66.66%)}
main{max-width:500px;margin:0 auto;padding:44px 22px 64px}
.eyebrow{text-transform:uppercase;letter-spacing:.22em;font-size:.72rem;font-weight:600;color:var(--red);margin:0 0 10px;text-align:center}
h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:clamp(2.1rem,9vw,2.8rem);line-height:1.1;margin:0 0 10px;text-align:center}
.sub{text-align:center;color:var(--muted);margin:0 0 30px}
.inv{display:block;width:100%;height:auto;border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 12px 32px rgba(34,57,42,.14)}
.facts{display:grid;grid-template-columns:1fr 1fr;margin:32px 0 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.facts div{padding:16px 6px;text-align:center}
.facts div+div{border-left:1px solid var(--line)}
.facts small{display:block;text-transform:uppercase;letter-spacing:.16em;font-size:.68rem;color:var(--muted);font-weight:600}
.facts b{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:1.1rem}
h2{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:1.5rem;margin:44px 0 4px}
.lead{color:var(--muted);margin:0 0 4px}
label,legend{display:block;font-size:.85rem;font-weight:600;margin:20px 0 6px;padding:0}
input[type=text],textarea{width:100%;padding:12px 14px;font:inherit;color:inherit;background:#fff;border:1px solid var(--line);border-radius:6px}
input:focus,textarea:focus{outline:2px solid var(--navy);outline-offset:1px;border-color:var(--navy)}
fieldset{border:0;margin:0;padding:0}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{position:relative;margin:0;padding:13px 8px;text-align:center;font-weight:500;font-size:1rem;background:#fff;border:1px solid var(--line);border-radius:6px;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.choice:hover{border-color:var(--navy)}
.choice input{position:absolute;opacity:0}
.choice:has(input:checked){background:var(--navy);border-color:var(--navy);color:#fff}
.choice:has(input:focus-visible){outline:2px solid var(--navy);outline-offset:2px}
button{margin-top:28px;width:100%;padding:15px;font:inherit;font-weight:600;letter-spacing:.04em;color:#fff;background:var(--red);border:0;border-radius:6px;cursor:pointer;transition:background .15s}
button:hover{background:#98202f}
button:focus-visible{outline:2px solid var(--navy);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="top"></div>
<main>
  <p class="eyebrow">Staff Christmas Party</p>

  <p class="sub">An American Christmas. Dress for it.</p>
